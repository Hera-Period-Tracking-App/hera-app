name: hera_app
description: Privacy-first offline menstrual cycle tracker.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  drift: ^2.28.1
  flutter_local_notifications: ^17.2.4
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^3.0.0
  go_router: ^14.8.1
  json_annotation: ^4.9.0
  local_auth: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod: ^3.0.0
  sqlcipher_flutter_libs: ^0.6.4
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  drift_dev: ^2.28.0
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0
  custom_lint: ^0.8.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/homepage/
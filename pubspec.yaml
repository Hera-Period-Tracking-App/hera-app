name: hera_app
description: Privacy-first offline menstrual cycle tracker.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  cryptography: ^2.7.0
  drift: ^2.28.1
  fllama:
    path: vendor/fllama
  flutter_local_notifications: ^17.2.4
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^3.0.0
  go_router: ^14.8.1
  json_annotation: ^4.9.0
  local_auth: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod: ^3.0.0
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.9.4
  timezone: ^0.9.4
  uuid: ^4.5.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.4
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  drift_dev: ^2.28.0
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0
  custom_lint: ^0.8.1

flutter_native_splash:
  color: "#12131A"
  image: assets/images/logo/app-logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#12131A"
    image: assets/images/logo/app-logo.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/models/LFM2-5-230M-q4-0.gguf
    - lib/features/cyclePrediction/cycle_model_local.json
    - assets/images/homepage/
    - assets/images/logo/
  fonts:
    - family: SatyrPassionate
      fonts:
        - asset: assets/fonts/SatyrPassionate-7OVw.ttf
